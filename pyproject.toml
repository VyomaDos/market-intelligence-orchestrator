[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-intelligence-orchestrator"
version = "0.1.0"
description = "A stateful multi-agent competitor intelligence workflow for product teams."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1.2.11,<2",
  "openai>=3.7,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "streamlit>=1.42,<2",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.9,<1"]
demo = ["playwright>=1.58,<2"]

[project.scripts]
market-intel = "market_intel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
